name: CI

# v0.53 可信构建与跨平台验证基线:
# - push / PR:ubuntu+macoS+windows × Node 18/20/22 九组合跑全量回归 + 差分模糊 + 证明模糊
# - C 腿独立 job(ubuntu/macos):有 gcc/clang 时全量回归自动启用 C 测试;无编译器则自跳过
# - nightly:三种子深模糊(120 程序)+ 证明模糊 300 例
# 约束:只用官方 action(actions/checkout / actions/setup-node),零 npm 依赖(仓库零依赖)。
#
# v0.91 文档漂移防护与支持矩阵(plan §4.15 T4.4/T4.3):
# - docs-and-matrix job(ubuntu+Node20):node tests/docs_check.mjs(版本三处/README 最新版本/
#   工具数/能力矩阵 42-10-3/历史表首条) + node tests/support_matrix/run.mjs(21 形态 × 5 列
#   支持矩阵逐格实测比对;ubuntu 自带 gcc,cc 腿参与;无编译器环境 cc 列自动跳过不失败)。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    # v1.0.0-rc.1 起:套件分节并行化(逐节一致验收,countMismatches=0;plan §4.19)。
    # CI 策略(架构师裁决 2026-11-22,第六轮后):
    # - node20/22:全量回归 --parallel(第五轮实测 6 组合全绿)——语义合同由现役引擎验证;
    # - node18:冒烟级(wasm 严格存活 + docs_check + fuzz×25 + proof_fuzz×100)——node18 双核
    #   runner 上全量回归的并发/serve 类分节(§13/§15/§16/§30)在并行放大 10-100 倍、串行下也
    #   600-720s(spawnT 120s 连环超时;同机同测试 node22 全绿,系 runner 性能 × node18 衰减,
    #   非引擎语义 bug);node18 于 2025-04 EOL,engines >=18 兼容声明不收缩,冒烟级保持
    #   "旧引擎可启动、核心语义可执行"的信号。full run 每次 = node20/22 腿 + 本机。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
        include:
          - node: 18
            smoke: true
    steps:
      - name: 检出
        uses: actions/checkout@v4
      - name: 安装 Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Node 版本
        run: node --version
      - name: wasm 分层存活(examples/fib.ming --strict-wasm;纯 Node,不依赖 gcc)
        run: node bin/ming.js run examples/fib.ming --strict-wasm
      - name: 全量回归(分节并行)
        if: matrix.smoke != true
        run: node tests/run.mjs --parallel
      - name: node18 冒烟(docs_check + wasm/check/fmt/test 语义抽样)
        if: matrix.smoke == true
        run: |
          node tests/docs_check.mjs
          node bin/ming.js check examples/fib.ming --json
          node bin/ming.js run examples/fib.ming --tree
          node bin/ming.js test tests/experiment/tasks/a1_log_clean/verify.ming
      - name: 差分模糊(seed 44044,25 程序)
        run: node tests/fuzz.mjs --seed 44044 --count 25
      - name: 静态边界证明模糊(100 例)
        run: node tests/proof_fuzz.mjs --count 100

  c-backend:
    name: c-backend (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 检出
        uses: actions/checkout@v4
      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 编译器探测(无编译器则 C 相关测试自动跳过,不失败)
        run: |
          if command -v gcc >/dev/null 2>&1; then gcc --version | head -n 1; fi
          if command -v clang >/dev/null 2>&1; then clang --version | head -n 1; fi
          if ! command -v gcc >/dev/null 2>&1 && ! command -v clang >/dev/null 2>&1; then
            echo "无 gcc/clang:C 相关测试将自动跳过(本 job 成功)"
          fi
      - name: 全量回归(C 腿自动启用;分节并行)
        run: node tests/run.mjs --parallel

  docs-and-matrix:
    name: docs-and-matrix (ubuntu, node 20)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出
        uses: actions/checkout@v4
      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 文档数字校验(版本三处/README 最新版本/工具数/能力矩阵计数)
        run: node tests/docs_check.mjs
      - name: 支持矩阵逐格实测(21 形态 × 5 列;cc 缺席自动跳列)
        run: node tests/support_matrix/run.mjs

  # Z3 外部消费验证(plan §4.20 R-15 剩余子项;roadmap §5.1 交付物):
  # ming check --proof-format smt-lib 的 VC 脚本由外部 SMT 求解器独立消费并逐块对照
  # 内部判定(docs/proof-protocol.md §6)。apt 安装失败即 job 失败,不吞——本 job 是
  # "Z3 能消费 Ming 输出"的唯一自动验证位(tests/z3_check.mjs 在无 z3 时跳过 exit 0)。
  z3-verify:
    name: z3-verify (ubuntu, node 22)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出
        uses: actions/checkout@v4
      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 z3(失败即 job 失败,不静默跳过验证)
        run: sudo apt-get update && sudo apt-get install -y z3
      # 审查 MINOR-2:装包成功但命令不可用(改名/PATH 漂移)时,z3_check 会走跳过路径 exit 0
      # → job 假绿。此步强制探测:命令不可用即 job 失败,验证窗口不静默消失。
      - name: 探测 z3 可执行(防"装成功但探测失败→静默跳过")
        run: z3 --version
      - name: Z3 外部消费验证(9 语料逐块对照内部判定)
        run: node tests/z3_check.mjs

  nightly:
    name: nightly (seed ${{ matrix.seed }})
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        seed: [44044, 7, 2026]
    steps:
      - name: 检出
        uses: actions/checkout@v4
      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 差分模糊(seed ${{ matrix.seed }},120 程序)
        run: node tests/fuzz.mjs --seed ${{ matrix.seed }} --count 120
      - name: 静态边界证明模糊(300 例)
        run: node tests/proof_fuzz.mjs --count 300
